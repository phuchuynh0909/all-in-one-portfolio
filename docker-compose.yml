version: "3.9"
services:
  backend:
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Vendored TradingAgents source (repo root, outside the build context) —
      # mounted so the sys.path shim in app/services/tradingagents can import it.
      - ./vendor:/app/vendor
    environment:
      - APP_ENVIRONMENT=development
      - APP_PROJECT_NAME=Investment Tracker API
      - APP_API_V1_PREFIX=/api/v1
      # The ORM runs on MySQL (my_portfolio) — settings.database_url is built
      # from these. There is deliberately no APP_DATABASE_URL here: setting it
      # overrides the lot and is how you'd point back at a SQLite file.
      - MYSQL_HOST=${MYSQL_HOST:-192.168.1.3}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-kyostyle1}
      - MYSQL_DB=${MYSQL_DB:-my_portfolio}
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-192.168.1.3}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-8123}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-kyostyle1}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-kyostyle1}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-default}
    env_file:
      - .env
    networks:
      - appnet
      - shared_network
  frontend:
    build: ./frontend
    command: ["npm", "run", "dev", "--", "--host"]
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json
      - ./frontend/package.json:/app/package.json
      - ./frontend/package-lock.json:/app/package-lock.json
      # Experiment store output. The page reads these Parquet files directly
      # with DuckDB-WASM, so they must be served as static assets. A symlink in
      # public/ cannot work here: it would resolve outside /app in the
      # container. Named "experiment-data", not "experiments", to avoid
      # colliding with the /experiments SPA route.
      - ./data/experiments:/app/public/experiment-data
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - appnet
  
  worker-tick-ingest:
    build: ./worker
    command: ["python", "-m", "bytewax.run", "workers.tick_ingest:flow"]
    volumes:
      - ./worker:/app
      - worker_state:/app/state_dir
    env_file:
      - ./worker/.env
    networks:
      - appnet
      - shared_network
    restart: unless-stopped

  worker-price-alerts:
    build: ./worker
    command: ["python", "-m", "bytewax.run", "workers.price_alerts:flow"]
    volumes:
      # No portfolio.db mount: the alerts this worker reads live in MySQL now.
      - ./worker:/app
      - worker_state:/app/state_dir
    environment:
      - MYSQL_HOST=${MYSQL_HOST:-192.168.1.3}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-kyostyle1}
      - MYSQL_DB=${MYSQL_DB:-my_portfolio}
    env_file:
      - ./worker/.env
    networks:
      - appnet
      - shared_network
    restart: unless-stopped

  # Keeps ohlc_5m current for the Future page, which reads it intraday
  # (backend/app/api/v1/routes/future.py). Each pass re-aggregates the whole
  # session; ReplacingMergeTree dedupes, so repeating is harmless.
  worker-ohlc-5m:
    build: ./worker
    command: ["python", "-m", "workers.ohlc_5m", "--poll", "60"]
    volumes:
      - ./worker:/app
      - worker_state:/app/state_dir
    env_file:
      - ./worker/.env
    environment:
      - OHLC_5M_SYNC_STATE_PATH=/app/state_dir/ohlc_5m_sync_state.json
    networks:
      - appnet
      - shared_network
    restart: unless-stopped
networks:
  appnet:
    driver: bridge
  
  shared_network:
    name: my-common-network
    external: true
    
volumes:
  frontend_node_modules:
  worker_state:
