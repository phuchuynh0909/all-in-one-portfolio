version: "3.9"

# Load environment variables from prod.env file
# You can override these by setting environment variables directly
# or by modifying the prod.env file

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"  # Expose backend API on port 8000
    volumes:
      - ./backend/models:/app/models
      - ./backend/portfolio.db:/app/app/portfolio.db
    env_file:
      - prod.env
    environment:
      - APP_ENVIRONMENT=production
      - APP_PROJECT_NAME=Investment Tracker API
      - APP_API_V1_PREFIX=/api/v1
      - DATABASE_URL=sqlite:///app/portfolio.db
    networks:
      - appnet
      - shared_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    ports:
      - "8080:80"  # Expose frontend on port 8080
    depends_on:
      - backend
    networks:
      - appnet
    restart: unless-stopped

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    command: ["python", "-m", "bytewax.run", "isp"]
    volumes:
      - worker_state:/app/state_dir
    env_file:
      - prod.env
    environment:
      # ClickHouse Configuration
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-myuser}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-mypassword}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-default}
    networks:
      - appnet
      - shared_network
    restart: unless-stopped

networks:
  appnet:
    driver: bridge

  shared_network:
    name: my-common-network
    external: true

volumes:
  npm_data:
  npm_letsencrypt:
  worker_state:
