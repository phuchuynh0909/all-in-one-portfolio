version: "3.9"

# prod.env must sit next to this file (repo root). Paths are resolved relative to the compose file.
#
# Compose substitution (${VAR} in this YAML) uses the shell env + the file passed to the CLI:
#   docker compose --env-file prod.env -f docker-compose.prod.yml ...
# (see Makefile prod-* targets). It does NOT read prod.env for ${VAR} unless you pass --env-file.
#
# Service-level env_file: loads KEY=VALUE into the container from disk. Do not duplicate those keys
# in `environment:` as KEY=${KEY:-default} — empty host env overrides env_file with the default.

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"  # Expose backend API on port 8000
    volumes:
      - ./backend/models:/app/models
      # Assets (params JSON, backtest .h5) are dockerignored and mounted at runtime.
      - ./backend/assets:/app/assets
      # Vendored TradingAgents source (repo root, outside the build context).
      - ./vendor:/app/vendor
    env_file:
      - path: ./prod.env
        required: true
    environment:
      - APP_ENVIRONMENT=production
      - APP_PROJECT_NAME=Investment Tracker API
      - APP_API_V1_PREFIX=/api/v1
      # The ORM runs on MySQL (my_portfolio) — settings.database_url is built
      # from these. Setting DATABASE_URL/APP_DATABASE_URL overrides the lot.
      - MYSQL_HOST=${MYSQL_HOST:-192.168.1.3}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-kyostyle1}
      - MYSQL_DB=${MYSQL_DB:-my_portfolio}
    networks:
      - appnet
      - shared_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    ports:
      - "8080:80"  # Expose frontend on port 8080
    depends_on:
      - backend
    networks:
      - appnet
    restart: unless-stopped

  worker-tick-ingest:
    build:
      context: ./worker
      dockerfile: Dockerfile
    command: ["python", "-m", "bytewax.run", "workers.tick_ingest:flow"]
    volumes:
      - worker_state:/app/state_dir
    env_file:
      - path: ./prod.env
        required: true
    networks:
      - appnet
      - shared_network
    restart: unless-stopped

  worker-price-alerts:
    build:
      context: ./worker
      dockerfile: Dockerfile
    command: ["python", "-m", "bytewax.run", "workers.price_alerts:flow"]
    volumes:
      # No portfolio.db mount: the alerts this worker reads live in MySQL now.
      - worker_state:/app/state_dir
    environment:
      - MYSQL_HOST=${MYSQL_HOST:-192.168.1.3}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-kyostyle1}
      - MYSQL_DB=${MYSQL_DB:-my_portfolio}
    env_file:
      - path: ./prod.env
        required: true
    networks:
      - appnet
      - shared_network
    restart: unless-stopped

  worker-hawkes:
    build:
      context: ./worker
      dockerfile: Dockerfile
    command: ["python", "-m", "workers.hawkes_signal_worker"]
    volumes:
      - worker_state:/app/state_dir
    env_file:
      - path: ./prod.env
        required: true
    environment:
      - HAWKES_STATE_PATH=/app/state_dir/hawkes_signal_state.json
      - OHLC_5M_SYNC_STATE_PATH=/app/state_dir/ohlc_5m_sync_state.json
    networks:
      - appnet
      - shared_network
    restart: unless-stopped

networks:
  appnet:
    driver: bridge

  shared_network:
    name: my-common-network
    external: true

volumes:
  npm_data:
  npm_letsencrypt:
  worker_state:
